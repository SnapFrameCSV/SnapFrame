name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files exist
        run: |
          for f in README.md OPERATIONS.md STATE.md LOG.md DECISIONS.md LICENSES.md LICENSE agent/RUN.md; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
      - name: No secrets committed (cheap check)
        run: |
          ! grep -rEn '(sk_live_|rk_live_|whsec_|ghp_|github_pat_|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY)' --exclude-dir=.git --exclude-dir=.github . || { echo "possible secret committed"; exit 1; }
      - name: Preflight script runs
        run: bash scripts/preflight.sh
  # Extension and Worker jobs are added when those folders exist (Phase 3, step 5.1+).
