# Snapframe licence Worker (design §2, D06, D07). Deployed by
# .github/workflows/deploy-worker.yml with CLOUDFLARE_API_TOKEN /
# CLOUDFLARE_ACCOUNT_ID from GitHub Actions secrets (gate-05).
#
# Secrets (set in the Cloudflare dashboard or `wrangler secret put`, never here):
#   STRIPE_RESTRICTED_KEY  read-only: Checkout Sessions, Charges, Payment Intents (gate-04)
#   STRIPE_WEBHOOK_SECRET  the webhook endpoint's signing secret (gate-04)
#   LICENCE_SIGNING_KEY    Ed25519 private key, PKCS8 base64 (gate-05, generated by scripts/generate-keypair.html)

name = "snapframe-licence"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# The Stripe Payment Link; /buy redirects here so the extension never hard-codes it.
PAYMENT_LINK_URL = "REPLACE_AT_GATE_04"
# Where /success and /lost-key point people for help.
SUPPORT_URL = "https://github.com/SnapFrameCSV/snapframe/issues"

[[kv_namespaces]]
binding = "KEYS"
id = "REPLACE_AT_GATE_05"
